<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LibiShelf</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1c2430;--mu:#6b7686;--ac:#2f6fed;--bd:#dde1e8;--red:#e5484d;--yel:#f5b82e;--grn:#2f9e63;box-sizing:border-box}
:root[data-theme=dark]{--bg:#12161c;--card:#1b212a;--tx:#e8ecf1;--mu:#93a0b2;--bd:#2b3441;--ac:#5b8cff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12161c;--card:#1b212a;--tx:#e8ecf1;--mu:#93a0b2;--bd:#2b3441;--ac:#5b8cff}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;display:flex}
nav{background:var(--card);border-right:1px solid var(--bd);padding:10px 8px;display:flex;flex-direction:column;gap:6px;width:62px;transition:width .2s;overflow:hidden;flex:none;padding-top:max(10px,env(safe-area-inset-top))}
nav.open{width:190px}
nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--tx);padding:11px 14px;border-radius:10px;font-size:15px;cursor:pointer;white-space:nowrap;text-align:left}
nav button.on{background:var(--ac);color:#fff}nav button span.i{font-size:20px;width:22px;text-align:center}
main{flex:1;overflow:auto;padding:18px;padding-top:max(18px,env(safe-area-inset-top));min-width:0}
h1{margin:0 0 14px;font-size:22px}h3{margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat b{display:block;font-size:28px}.stat span,.mu{color:var(--mu);font-size:13px}
input,select,textarea,.btn{font:inherit;padding:10px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
input,textarea{width:100%}.btn{background:var(--ac);color:#fff;border:0;cursor:pointer;width:auto}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--red)}
.row{display:flex;gap:12px;align-items:center;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}
.row.red{border-left:6px solid var(--red)}.row.yel{border-left:6px solid var(--yel)}
.cv{width:44px;height:64px;border-radius:5px;background:var(--bd);flex:none;object-fit:cover}
.grow{flex:1;min-width:0}.t{font-weight:600}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;color:#fff;background:var(--mu);display:inline-block;margin-right:4px}
.tag.g{background:var(--grn)}.tag.r{background:var(--red)}.tag.y{background:var(--yel);color:#000}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow:auto}.tabs button{padding:9px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.scan{border:2px dashed var(--ac);border-radius:14px;padding:34px 10px;text-align:center;margin-bottom:12px;cursor:pointer}
.scan div{font-size:44px}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov .card{max-width:520px;width:100%;max-height:85vh;overflow:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--grn);color:#fff;padding:12px 20px;border-radius:10px;display:none;z-index:10}
.hid{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.sug button{margin:4px 4px 0 0}.fl{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
:root{--ac:#6d5ef0;--bg:#f2f0fb;--bd:#e3e0f2}
nav{background:linear-gradient(180deg,#2a1f6b,#5b3fc4);border:0;box-shadow:4px 0 20px #0002}
nav button{color:#ffffffcc;transition:.15s}nav button:hover{background:#ffffff22;color:#fff}nav button.on{background:#fff;color:#4a30b0;font-weight:600}
main{padding:22px}h1{font-size:28px;letter-spacing:-.5px}
.card,.row{border-radius:16px;box-shadow:0 2px 10px #2a1f6b14}.row{transition:.15s}.row:hover{transform:translateY(-2px);box-shadow:0 6px 18px #2a1f6b26}
.btn{background:linear-gradient(135deg,#6d5ef0,#9b4fe0);border-radius:10px;font-weight:600;box-shadow:0 3px 10px #6d5ef055}.btn.g{background:var(--card);box-shadow:none}.btn.r{background:var(--red)}
.tabs button.on{background:linear-gradient(135deg,#6d5ef0,#9b4fe0);border-color:transparent}
.hero{background:linear-gradient(135deg,#4a30b0,#b05cf0);color:#fff;border-radius:20px;padding:24px;margin-bottom:16px}.hero h1{margin:0 0 4px;color:#fff}
.stat{position:relative;overflow:hidden}.stat b{font-size:32px;background:linear-gradient(135deg,#6d5ef0,#c05cf0);-webkit-background-clip:text;background-clip:text;color:transparent}.stat i{position:absolute;right:10px;top:8px;font-size:26px;font-style:normal;opacity:.4}
.cv{position:relative;overflow:hidden;width:52px;height:76px;border-radius:6px;flex:none;box-shadow:0 3px 8px #0004;color:#fff;display:flex;align-items:flex-end;padding:4px;font-size:7px;font-weight:700;line-height:1.1}.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px;margin-top:6px}.bk{cursor:pointer;transition:.15s}.bk:hover{transform:translateY(-4px)}.bk .cv{width:100%;height:auto;aspect-ratio:2/3;font-size:14px;padding:10px;margin-bottom:8px}
.bigw .cv{width:110px;height:162px;font-size:12px;padding:8px}
.lb{transition:.25s;white-space:nowrap}nav:not(.open) .lb{opacity:0;width:0;margin-left:-12px}
nav button .i{transition:.25s}nav button:hover .i{transform:scale(1.25) rotate(-8deg)}nav button{overflow:hidden}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{opacity:0;transform:translate(-50%,30px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #6d5ef055}50%{box-shadow:0 0 0 14px #6d5ef000}}
@keyframes shift{50%{background-position:100% 50%}}
main>*{animation:up .45s backwards}.grid>*,.bkg>*,.row{animation:up .5s backwards}
.ov{animation:fade .2s}.ov .card{animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
#toast{animation:slide .35s;border-radius:30px;box-shadow:0 8px 24px #0004;font-weight:600}
.btn{transition:.15s}.btn:active{transform:scale(.94)}.btn:hover{filter:brightness(1.1)}
.scan{animation:pulse 2s infinite;transition:.2s}.scan:hover{background:#6d5ef012}.scan div{display:inline-block;animation:up 1.2s infinite alternate}
.hero{background-size:200% 200%;animation:shift 10s ease infinite}
.bk .cv{transition:.3s}.bk:hover .cv{transform:scale(1.05) rotate(-1.5deg);box-shadow:0 14px 28px #0006}
.tabs button{transition:.2s}.tag{transition:.2s}
.fl2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.lbl{background:#fff;color:#000;border:1px dashed #999;padding:8px;text-align:center;font-size:12px;border-radius:6px;break-inside:avoid}
.scan .scg{position:relative;width:120px;height:80px;margin:0 auto 10px;animation:none;display:block;color:var(--tx)}.scg i{position:absolute;left:8px;right:8px;height:3px;border-radius:3px;background:#ff3b4e;box-shadow:0 0 14px 2px #ff3b4e;animation:laser 1.5s ease-in-out infinite alternate}
@keyframes laser{from{top:10px}to{top:66px}}
@keyframes grow{from{transform:scaleY(0)}}.dbar{transform-origin:bottom;animation:grow .6s backwards}
/* v7 palette: calm library green + cream + gold */
:root{--bg:#f5f2ea;--bd:#e6e0d2;--ac:#0f7b6c;--tx:#1d2a27;--mu:#6c766f}
:root[data-theme=dark]{--ac:#37c2a3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ac:#37c2a3}}
nav{background:linear-gradient(180deg,#0f2e2a,#1a4a41);box-shadow:4px 0 20px #0f2e2a33}nav button.on{background:#f5ecd6;color:#0f2e2a}
.card,.row{box-shadow:0 2px 10px #1d2a2714}.row:hover{box-shadow:0 6px 18px #1d2a2724}
.btn{background:linear-gradient(135deg,#0f7b6c,#15a086);box-shadow:0 3px 10px #0f7b6c44}.btn.g{background:var(--card);box-shadow:none}.btn.r{background:var(--red);box-shadow:none}
.tabs button.on{background:linear-gradient(135deg,#0f7b6c,#15a086);border-color:transparent}
.hero{background:linear-gradient(135deg,#0f2e2a,#1f7a6d,#0f2e2a);background-size:200% 200%}
.stat b{background:linear-gradient(135deg,#0f7b6c,#d99a2b);-webkit-background-clip:text;background-clip:text}
.scan:hover{background:#0f7b6c12}.scg g[stroke]{stroke:var(--ac)}.dbar{background:linear-gradient(#15a086,#0f7b6c)!important}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #0f7b6c44}50%{box-shadow:0 0 0 14px #0f7b6c00}}
.snip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;margin:4px 0 6px}
[hidden]{display:none!important}
.x{flex:none;align-self:flex-start;margin-left:auto;border:0;background:var(--bd);color:var(--tx);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;transition:.2s}.x:hover{background:var(--red);color:#fff;transform:rotate(90deg)}
.hid{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;z-index:-1;border:0;padding:0;margin:0;outline:none;caret-color:transparent;pointer-events:none}
.bkl{display:flex;flex-direction:column;gap:16px;margin-top:6px}.bkl>*{animation:up .5s backwards}
.bkd{display:flex;gap:18px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;box-shadow:0 2px 10px #1d2a2714;transition:.15s}.bkd:hover{transform:translateY(-3px);box-shadow:0 8px 22px #1d2a2724}
.bkd .cv{width:150px;height:225px;font-size:16px;padding:12px;flex:none}.bkd .bt{font-size:22px;font-weight:700}.bkd .sum{margin-top:10px;line-height:1.55}
@media(max-width:560px){.bkd .cv{width:100px;height:150px}.bkd{gap:12px}}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none;box-shadow:none}
.co{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.lbl2{display:flex;gap:12px;align-items:center;background:#fff;color:#111;border:1.5px solid #111;border-radius:14px;padding:10px 12px;break-inside:avoid;font-family:system-ui,sans-serif}
.lbl2 .qr{width:88px;flex:none}.lbl2 .qr svg{width:100%;height:auto;display:block}.lbl2 .cn{font-weight:800;font-size:20px;line-height:1.1;letter-spacing:.3px}.lbl2 .lt{font-weight:600;font-size:12px;line-height:1.25;margin-top:5px}.lbl2 .la{font-size:11px;color:#555}.lbl2 .lc{font:10px monospace;color:#777;margin-top:5px}
@media(max-width:760px){body{flex-direction:column-reverse}main{min-height:0;padding:14px;padding-top:max(14px,env(safe-area-inset-top))}nav,nav.open{width:100%;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;gap:2px;box-shadow:0 -4px 16px #0003}nav>button:first-child{display:none}nav button{flex-direction:column;gap:2px;padding:7px 11px;font-size:10px;flex:none}nav .lb{opacity:1!important;width:auto!important;margin:0!important}.co{grid-template-columns:minmax(0,1fr)}input,select,textarea{font-size:16px}h1{font-size:24px}.bkg{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.ov{padding:8px}}
@media print{body>nav,body>main,#toast,.noprint{display:none!important}body{display:block;background:#fff}.ov{position:static;display:block;padding:0;background:none;animation:none}.ov .card{background:#fff;box-shadow:none;border:0;max-width:none!important;max-height:none;overflow:visible;animation:none}}
</style></head><body>
<nav id="nav"></nav><main id="main"></main><div id="toast"></div>
<script>
/* ===== DATA LAYER: swap these two methods for fetch() calls to a server later ===== */
const KEY='confLib_v1';
const Api={load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},
 save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}};
/* db.registry = SHARED conference-wide proofreading records (by ISBN). Everything else is per-library. */
function seed(){const t=Date.now(),d=n=>new Date(t+n*864e5).toISOString().slice(0,10);
 return{settings:{theme:'auto',lib:'LMS Library',days:14},
 books:{'9780743273565':{isbn:'9780743273565',title:'The Great Gatsby',author:'F. Scott Fitzgerald',cover:''},
  '9780061120084':{isbn:'9780061120084',title:'To Kill a Mockingbird',author:'Harper Lee',cover:''}},
 registry:{'9780743273565':{status:'approved',by:'Mrs. Reed (LMS Library)',date:d(-30),summary:'Jazz-age tragedy of wealth and longing. Contains some drinking and an affair; suitable for upper grades.'},
  '9780061120084':{status:'pending',by:null,assigned:null,summary:''}},
 catalog:['9780743273565','9780061120084'],
 patrons:[{id:1,name:'Kohn, Ruth',info:'Grade 10'},{id:2,name:'Miller, Sam',info:'Grade 8'}],
 loans:[{id:1,isbn:'9780743273565',patron:1,out:d(-10),due:d(2),back:null}],
 proofreaders:[{id:1,name:'Mrs. Reed',church:'LMS Library'},{id:2,name:'Mr. Yoder',church:'Grace Fellowship'}]}}
let db=Api.load()||seed();const save=()=>Api.save(db);save();
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let view='dash',tab='out',ptab='add',selPr=null,cart=[],recent=[],cur=null;
const NAV=[['dash','▦','Dashboard'],['books','📚','Books'],['add','＋','Add Book'],['lend','⇄','Lending'],['proof','✔','Proofreading'],['set','⚙','Settings']];
function toast(m,c){const t=$('#toast');t.textContent=m;t.style.background=c||'';t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function theme(){document.documentElement.dataset.theme=db.settings.theme==='auto'?'':db.settings.theme}
const book=i=>db.books[i]||{title:i,author:'',cover:''};
const loanOf=i=>db.loans.find(l=>l.isbn===i&&!l.back);
const pat=id=>db.patrons.find(p=>p.id===id)||{name:'?'};
const left=d=>Math.ceil((new Date(d+'T23:59:59')-Date.now())/864e5);
const cov=i=>{const b=book(i),h=Math.abs([...String(i)].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%360;return`<div class="cv" style="background:linear-gradient(145deg,hsl(${h},62%,46%),hsl(${(h+45)%360},66%,28%))"><span>${esc(b.title)}</span>${b.cover?`<img src="${esc(b.cover)}" onerror="this.remove()">`:''}</div>`};
function proofTag(i){const r=db.registry[i];if(!r)return'<span class="tag">Not proofread</span>';
 return r.status==='approved'?'<span class="tag g">Approved</span>':'<span class="tag y">Proofreading in progress</span>'}
function nav(){$('#nav').innerHTML=`<button onclick="$('#nav').classList.toggle('open')"><span class="i">☰</span></button>`+
 NAV.map(n=>`<button class="${view===n[0]?'on':''}" onclick="go('${n[0]}')"><span class="i">${n[1]}</span><span class="lb">${n[2]}</span></button>`).join('')}
function go(v){view=v;render()}
function render(){nav();theme();$('#main').innerHTML=V[view]();if(V[view+'_']) V[view+'_']()}
const tabs=(arr,cur,fn)=>`<div class="tabs">${arr.map(a=>`<button class="${a[0]===cur?'on':''}" onclick="${fn}('${a[0]}')">${a[1]}</button>`).join('')}</div>`;
const V={};
/* ---------- Dashboard ---------- */
V.dash=()=>{const out=db.loans.filter(l=>!l.back),od=out.filter(l=>left(l.due)<0).length;
 const st=(n,l)=>`<div class="card stat"><b>${n}</b><span>${l}</span></div>`;
 const reg=Object.values(db.registry);
 return`<h1>${esc(db.settings.lib)} Dashboard</h1><div class="grid">${st(db.catalog.length,'Books in catalog')}${st(out.length,'Checked out')}${st(od,'Overdue')}${st(db.patrons.length,'Patrons')}${st(db.loans.length,'Total checkouts')}${st(db.proofreaders.length,'Proofreaders')}${st(reg.filter(r=>r.status==='approved').length,'Approved (conference)')}${st(reg.filter(r=>r.status!=='approved').length,'Pending proofreading')}</div>
 <p><button class="btn" onclick="exportXls()">⬇ Download Excel (.xls)</button></p>`};
function exportXls(){const tb=(n,h,r)=>`<h3>${n}</h3><table border=1><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
 const h='<html><body>'+tb('Books',['ISBN','Title','Author','Proofread status','Proofread by'],db.catalog.map(i=>[i,book(i).title,book(i).author,(db.registry[i]||{}).status||'none',(db.registry[i]||{}).by||'']))
 +tb('Patrons',['Name','Info'],db.patrons.map(p=>[p.name,p.info]))
 +tb('Loans',['Book','Patron','Out','Due','Returned'],db.loans.map(l=>[book(l.isbn).title,pat(l.patron).name,l.out,l.due,l.back||'']))+'</body></html>';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'application/vnd.ms-excel'}));a.download='library-export.xls';a.click()}
/* ---------- Books ---------- */
V.books=()=>`<h1>Books</h1><input id="bq" placeholder="Search title, author, ISBN…" oninput="bres()"><div id="bres" style="margin-top:12px"></div>`;
V.books_=()=>bres();
function bres(){const q=($('#bq')||{value:''}).value.toLowerCase();
 $('#bres').innerHTML=db.catalog.filter(i=>(i+book(i).title+book(i).author).toLowerCase().includes(q)).map(i=>{const l=loanOf(i);
 return`<div class="row" onclick="detail('${i}')">${cov(i)}<div class="grow"><div class="t">${esc(book(i).title)}</div><div class="mu">${esc(book(i).author)} · ${i}</div>
 ${l?`<span class="tag r">Out: ${esc(pat(l.patron).name)} (due ${l.due})</span>`:'<span class="tag g">Available</span>'}${proofTag(i)}</div></div>`}).join('')||'<p class="mu">No books found.</p>'}
function detail(i){const r=db.registry[i],h=db.loans.filter(l=>l.isbn===i).reverse();
 const o=document.createElement('div');o.className='ov';o.onclick=e=>{if(e.target===o)o.remove()};
 o.innerHTML=`<div class="card"><div class="row" style="cursor:default">${cov(i)}<div class="grow"><div class="t">${esc(book(i).title)}</div><div class="mu">${esc(book(i).author)}<br>ISBN ${i}</div></div></div>
 <h3>Proofreading</h3>${r?(r.status==='approved'?`<p>${proofTag(i)} by ${esc(r.by)} on ${r.date}</p><p>${esc(r.summary)}</p>`:'<p>'+proofTag(i)+'</p>'):'<p>'+proofTag(i)+'</p>'}
 <h3>Checkout history</h3>${h.map(l=>`<div class="mu">${esc(pat(l.patron).name)} — ${l.out} → ${l.back||'<b>not returned</b>'}</div>`).join('')||'<span class="mu">Never checked out.</span>'}
 <p><button class="btn g" onclick="this.closest('.ov').remove()">Close</button></p></div>`;document.body.appendChild(o)}
/* ---------- Add Book ---------- */
V.add=()=>`<h1>Add Book</h1><div class="fl"><input id="isbn" placeholder="Enter ISBN" inputmode="numeric" style="flex:1;min-width:180px" onkeydown="if(event.key==='Enter')lookup()"><button class="btn" onclick="lookup()">Search</button></div><div id="addres"></div>`;
async function lookup(){const i=$('#isbn').value.replace(/[^0-9Xx]/g,'');if(!i)return;const out=$('#addres');out.innerHTML='<p class="mu">Searching Open Library…</p>';cur=null;
 try{const r=await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${i}&format=json&jscmd=data`);const d=(await r.json())['ISBN:'+i];
  if(d)cur={isbn:i,title:d.title,author:(d.authors||[]).map(a=>a.name).join(', '),cover:(d.cover||{}).medium||`https://covers.openlibrary.org/b/isbn/${i}-M.jpg`}}catch(e){}
 if(!cur){const ex=db.books[i];cur=ex?{...ex}:{isbn:i,title:'',author:'',cover:'',manual:true}}
 showAdd()}
function showAdd(){const c=cur,r=db.registry[c.isbn],mine=db.catalog.includes(c.isbn);
 let st;if(r&&r.status==='approved')st=`<p>${proofTag(c.isbn)} Proofread by <b>${esc(r.by)}</b> (${r.date})</p><p>${esc(r.summary)}</p><button class="btn" ${mine?'disabled':''} onclick="addCat()">${mine?'Already in your catalog':'Agree &amp; add to my catalog'}</button>`;
 else if(r)st=`<p>${proofTag(c.isbn)}</p><button class="btn" ${mine?'disabled':''} onclick="addCat()">${mine?'Already in your catalog':'Add to my catalog (pending)'}</button>`;
 else st=`<p>${proofTag(c.isbn)} Nobody in the conference has proofread this yet.</p><button class="btn" onclick="queue()">Add to proofreading list</button>`;
 $('#addres').innerHTML=`<div class="card">${c.manual?`<p class="mu">Couldn't fetch details (offline or not found). Enter them manually:</p><input id="mt" placeholder="Title" value="${esc(c.title)}" oninput="cur.title=this.value"><br><br><input id="ma" placeholder="Author" value="${esc(c.author)}" oninput="cur.author=this.value"><br><br>`:`<div class="row" style="cursor:default">${cov(c.isbn)}<div><div class="t">${esc(c.title)}</div><div class="mu">${esc(c.author)} · ${c.isbn}</div></div></div>`}${st}</div>`;
 if(!db.books[c.isbn])window._tmp=1}

</script><script>

 return`<div class="hero"><h1>${esc(db.settings.lib)}</h1><div>${od.length?`⚠ ${od.length} overdue book(s)`:'✔ Nothing overdue'} · ${out.length} checked out right now</div></div>

 <div class="card"><b>🕒 Recent activity</b>${db.loans.slice(-6).reverse().map(l=>`<div class="mu" style="margin:10px 0">${esc(pat(l.patron).name)} ${l.back?'returned':'borrowed'} <b>${esc(book(l.isbn).title)}</b> · ${l.back||l.out}</div>`).join('')}</div></div>`};

 $('#bres').innerHTML=db.catalog.filter(i=>(i+book(i).title+book(i).author).toLowerCase().includes(q)).filter(i=>{const r=db.registry[i];return bf==='all'||(bf==='in'&&!loanOf(i))||(bf==='out'&&loanOf(i))||(bf==='ok'&&r&&r.status==='approved')||(bf==='pend'&&(!r||r.status!=='approved'))}).map(i=>{const l=loanOf(i);
 return`<div class="bk" onclick="detail('${i}')">${cov(i)}<div class="t">${esc(book(i).title)}</div><div class="mu">${esc(book(i).author)}</div>${l?'<span class="tag r">Out</span>':'<span class="tag g">Available</span>'}${proofTag(i)}</div>`}).join('')||'<p class="mu">No books found.</p>'}
function detail(i){const r=db.registry[i],h=db.loans.filter(l=>l.isbn===i).reverse(),l0=loanOf(i);
 const o=document.createElement('div');o.className='ov';o.onclick=e=>{if(e.target===o)o.remove()};
 o.innerHTML=`<div class="card"><div class="fl" style="flex-wrap:nowrap;align-items:flex-start"><div class="bigw">${cov(i)}</div><div class="grow"><input id="et" value="${esc(book(i).title)}"><br><br><input id="ea" value="${esc(book(i).author)}"><br><br><input id="eg" placeholder="Genre" value="${esc(book(i).genre||'')}"><br><br><input id="etg" placeholder="Tags: world war 2, history, biography" value="${esc((book(i).tags||[]).join(', '))}"><p class="mu">ISBN ${i}${book(i).bc?' · 🏷 '+esc(book(i).bc):''}${book(i).year?' · '+esc(book(i).year):''}${book(i).genre?' · '+esc(book(i).genre):''}${book(i).loc?'<br>📍 '+esc(book(i).loc):''}</p>${book(i).desc?'<p>'+esc(book(i).desc)+'</p>':''}${l0?`<span class="tag r">Out: ${esc(pat(l0.patron).name)} · due ${l0.due}</span>`:'<span class="tag g">Available</span>'}${proofTag(i)}</div></div>

function lres(){const q=$('#lq').value.toLowerCase();
 $('#lres').innerHTML=db.loans.map((l,x)=>[l,x]).filter(([l])=>!l.back&&(book(l.isbn).title+pat(l.patron).name+l.isbn).toLowerCase().includes(q)).sort((a,b)=>a[0].due.localeCompare(b[0].due)).map(([l,x])=>{const d=left(l.due);
