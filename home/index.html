<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damien's Letter</title>
    
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Feather Icons for lightweight modern icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Very light gray/blue background */
        }
        
        /* Slideshow specific styles */
        .slide {
            opacity: 0;
            transition: opacity 0.7s ease-in-out, transform 0.7s ease-in-out;
            transform: scale(1.05);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none; /* Prevent clicking invisible slides */
        }
        .slide.active {
            opacity: 1;
            transform: scale(1);
            z-index: 10;
            pointer-events: auto;
        }
        
        /* Image overlay for text readability */
        .image-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.1) 100%);
        }

        /* Hide scrollbar for clean look in edge cases */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-gray-800 antialiased flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-white/90 backdrop-blur-md border-b border-gray-100 shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-2 cursor-pointer">
                    <div class="w-10 h-10 bg-black rounded-lg flex items-center justify-center text-white font-bold text-xl">
                        DL
                    </div>
                    <span class="font-bold text-2xl tracking-tight text-gray-900">Damien's Letter</span>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="#" class="text-gray-900 font-semibold hover:text-blue-600 transition-colors">Home</a>
                    <a href="#articles" class="text-gray-600 hover:text-blue-600 transition-colors">Latest Articles</a>
                    <a href="#" class="text-gray-600 hover:text-blue-600 transition-colors">About</a>
                    <a href="#" class="bg-black text-white px-5 py-2.5 rounded-full font-medium hover:bg-gray-800 transition-colors shadow-md">Subscribe</a>
                </div>

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center">
                    <button class="text-gray-600 hover:text-black focus:outline-none p-2">
                        <i data-feather="menu"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-20">
        
        <!-- Hero Slideshow Section -->
        <section class="relative w-full max-w-7xl mx-auto mt-6 px-4 sm:px-6 lg:px-8">
            <div class="relative w-full h-[50vh] md:h-[65vh] rounded-3xl overflow-hidden shadow-2xl bg-gray-900 group" id="slideshow-container">
                
                <!-- Slides will be injected here by JavaScript -->
                <div id="slides-wrapper" class="w-full h-full relative"></div>

                <!-- Navigation Controls -->
                <button id="prev-slide" class="absolute left-4 top-1/2 -translate-y-1/2 z-20 bg-white/20 hover:bg-white/40 backdrop-blur-md text-white p-3 rounded-full opacity-0 group-hover:opacity-100 transition-all duration-300 focus:outline-none">
                    <i data-feather="chevron-left"></i>
                </button>
                <button id="next-slide" class="absolute right-4 top-1/2 -translate-y-1/2 z-20 bg-white/20 hover:bg-white/40 backdrop-blur-md text-white p-3 rounded-full opacity-0 group-hover:opacity-100 transition-all duration-300 focus:outline-none">
                    <i data-feather="chevron-right"></i>
                </button>

                <!-- Dots Indicator -->
                <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex space-x-3" id="slide-dots">
                    <!-- Dots injected by JS -->
                </div>
            </div>
        </section>

        <!-- Latest Articles Section -->
        <section id="articles" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
            <div class="flex items-center justify-between mb-10">
                <h2 class="text-3xl md:text-4xl font-bold text-gray-900 tracking-tight">Latest Stories</h2>
                <a href="#" class="hidden md:flex items-center text-blue-600 font-semibold hover:text-blue-800 transition-colors">
                    View all <i data-feather="arrow-right" class="ml-2 w-4 h-4"></i>
                </a>
            </div>
            
            <!-- Articles Grid container -->
            <div id="articles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Articles will be injected here by JavaScript -->
            </div>
            
            <div class="mt-10 text-center md:hidden">
                <a href="#" class="inline-flex items-center text-blue-600 font-semibold hover:text-blue-800 transition-colors">
                    View all stories <i data-feather="arrow-right" class="ml-2 w-4 h-4"></i>
                </a>
            </div>
        </section>
        
        <!-- Newsletter Section (Optional Bonus) -->
        <section class="bg-blue-600 text-white py-16 mt-8">
            <div class="max-w-4xl mx-auto px-4 text-center">
                <h2 class="text-3xl font-bold mb-4">Never Miss a Letter</h2>
                <p class="text-blue-100 mb-8 text-lg">Join the mailing list to get the latest updates and exclusive stories delivered directly to your inbox.</p>
                <div class="flex flex-col sm:flex-row justify-center gap-3 max-w-md mx-auto">
                    <input type="email" placeholder="Enter your email" class="px-5 py-3 rounded-full text-gray-900 w-full focus:outline-none focus:ring-4 focus:ring-blue-400/50">
                    <button class="bg-black text-white px-8 py-3 rounded-full font-bold hover:bg-gray-800 transition-colors whitespace-nowrap">Subscribe</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 pt-16 pb-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-black rounded text-white flex items-center justify-center font-bold text-sm">DL</div>
                <span class="font-bold text-xl text-gray-900">Damien's Letter</span>
            </div>
            <div class="text-gray-500 text-sm">
                &copy; <span id="year"></span> Damien's Letter. All rights reserved.
            </div>
            <div class="flex space-x-6 text-gray-400">
                <a href="#" class="hover:text-black transition-colors"><i data-feather="twitter"></i></a>
                <a href="#" class="hover:text-black transition-colors"><i data-feather="instagram"></i></a>
                <a href="#" class="hover:text-black transition-colors"><i data-feather="mail"></i></a>
            </div>
        </div>
    </footer>

    <script>
        // Set current year in footer
        document.getElementById('year').textContent = new Date().getFullYear();
        
        // Initialize Feather Icons
        feather.replace();

        /* ======================================================================
           === UPDATE YOUR CONTENT HERE ===
           This is the only section you need to edit to update your website!
           ====================================================================== */

        // 1. SLIDESHOW CONFIGURATION (Hot Stories)
        // Add or remove items here. 
        // 'image'   : the file name uploaded to your github (e.g., 'slideshow-1.png')
        // 'link'    : where the user goes when they click the image (e.g., 'story1.html')
        // 'title'   : The big text on the slide
        // 'category': The small text above the title
        const hotStories = [
            {
                image: 'slideshow-1.png', 
                link: '#link-to-your-hot-story-1',
                title: 'The Future of Digital Publishing is Here',
                category: 'Breaking News'
            },
            {
                image: 'slideshow-2.png',
                link: '#link-to-your-hot-story-2',
                title: 'Exclusive: Behind the Scenes of Damien\'s Letter',
                category: 'Exclusive'
            },
            {
                image: 'slideshow-3.png',
                link: '#link-to-your-hot-story-3',
                title: 'Top 10 Trends Shaping Our World Today',
                category: 'Analysis'
            }
        ];

        // 2. OTHER ARTICLES CONFIGURATION (Grid below the slideshow)
        // Update the name, link, and excerpt for your accessible articles.
        const otherArticles = [
            {
                image: 'article-1.png',
                link: '#link-to-article-1',
                title: 'Understanding the New Tech Wave',
                category: 'Technology',
                date: 'Oct 24, 2024',
                excerpt: 'A deep dive into how recent advancements are changing the way we interact with everyday tools.'
            },
            {
                image: 'article-2.png',
                link: '#link-to-article-2',
                title: 'The Art of Modern Storytelling',
                category: 'Culture',
                date: 'Oct 22, 2024',
                excerpt: 'Why print letters are making a comeback in a purely digital age.'
            },
            {
                image: 'article-3.png',
                link: '#link-to-article-3',
                title: 'Financial Markets: What to Watch',
                category: 'Finance',
                date: 'Oct 20, 2024',
                excerpt: 'Key indicators and trends you should be paying attention to this quarter.'
            },
            {
                image: 'article-4.png',
                link: '#link-to-article-4',
                title: 'Health & Wellness in a Busy World',
                category: 'Lifestyle',
                date: 'Oct 18, 2024',
                excerpt: 'Simple strategies to maintain balance when your schedule is overloaded.'
            },
            {
                image: 'article-5.png',
                link: '#link-to-article-5',
                title: 'Travel: Hidden Gems of 2024',
                category: 'Travel',
                date: 'Oct 15, 2024',
                excerpt: 'Escape the tourist traps with these underrated destinations.'
            },
            {
                image: 'article-6.png',
                link: '#link-to-article-6',
                title: 'Editorial: The Vision for Next Year',
                category: 'Editorial',
                date: 'Oct 12, 2024',
                excerpt: 'A letter from the editor outlining the upcoming goals for our publication.'
            }
        ];

        /* ======================================================================
           DO NOT EDIT BELOW THIS LINE (Unless you want to change how it works)
           ====================================================================== */

        
        // Helper function: Fallback image logic so site doesn't break if github image is missing/loading
        const getImageUrl = (imageName, width, height) => {
            // We use the exact filename provided. If it fails to load, the 'onerror' tag handles it.
            return imageName;
        };
        const getFallback = (width, height, text) => {
            return `https://placehold.co/${width}x${height}/1e293b/ffffff?text=${encodeURIComponent(text)}`;
        };

        // Render Slideshow
        const slidesWrapper = document.getElementById('slides-wrapper');
        const dotsContainer = document.getElementById('slide-dots');

        hotStories.forEach((story, index) => {
            // Create Slide Element
            const slide = document.createElement('a');
            slide.href = story.link;
            slide.className = `slide block ${index === 0 ? 'active' : ''}`;
            
            // Note: Added onerror to default to a placeholder if your github image isn't uploaded yet
            slide.innerHTML = `
                <img src="${story.image}" 
                     onerror="this.onerror=null; this.src='${getFallback(1200, 600, 'Upload ' + story.image + ' to GitHub')}';" 
                     alt="${story.title}" 
                     class="w-full h-full object-cover">
                <div class="absolute inset-0 image-overlay"></div>
                <div class="absolute bottom-0 left-0 w-full p-8 md:p-16 flex flex-col justify-end">
                    <span class="inline-block bg-blue-600 text-white text-xs font-bold uppercase tracking-wider py-1 px-3 rounded-full mb-4 w-max">
                        ${story.category}
                    </span>
                    <h2 class="text-3xl md:text-5xl font-extrabold text-white leading-tight max-w-3xl mb-4 drop-shadow-md">
                        ${story.title}
                    </h2>
                    <span class="text-blue-200 font-medium flex items-center group-hover:text-white transition-colors">
                        Read Story <i data-feather="arrow-right" class="ml-2 w-4 h-4"></i>
                    </span>
                </div>
            `;
            slidesWrapper.appendChild(slide);

            // Create Dot
            const dot = document.createElement('button');
            dot.className = `w-3 h-3 rounded-full transition-all duration-300 focus:outline-none ${index === 0 ? 'bg-white w-8' : 'bg-white/50 hover:bg-white/80'}`;
            dot.addEventListener('click', () => goToSlide(index));
            dotsContainer.appendChild(dot);
        });

        // Render Articles
        const articlesGrid = document.getElementById('articles-grid');

        otherArticles.forEach(article => {
            const card = document.createElement('div');
            card.className = "bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-shadow duration-300 border border-gray-100 flex flex-col group cursor-pointer h-full";
            
            // Wrap entire card in a link to make it easily accessible
            card.innerHTML = `
                <a href="${article.link}" class="flex flex-col h-full">
                    <div class="relative h-56 overflow-hidden">
                        <img src="${article.image}" 
                             onerror="this.onerror=null; this.src='${getFallback(600, 400, 'Upload ' + article.image)}';" 
                             alt="${article.title}" 
                             class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute top-4 left-4">
                            <span class="bg-black/70 backdrop-blur-sm text-white text-xs font-bold uppercase tracking-wider py-1 px-3 rounded-full">
                                ${article.category}
                            </span>
                        </div>
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <div class="text-sm text-gray-500 mb-2">${article.date}</div>
                        <h3 class="text-xl font-bold text-gray-900 mb-3 group-hover:text-blue-600 transition-colors leading-snug">
                            ${article.title}
                        </h3>
                        <p class="text-gray-600 mb-6 flex-grow line-clamp-3">
                            ${article.excerpt}
                        </p>
                        <div class="mt-auto flex items-center text-blue-600 font-semibold text-sm">
                            Read article <i data-feather="arrow-right" class="ml-1 w-4 h-4"></i>
                        </div>
                    </div>
                </a>
            `;
            articlesGrid.appendChild(card);
        });

        // Re-initialize icons for newly added elements
        feather.replace();

        
        // Slideshow Logic
        let currentSlideIndex = 0;
        const totalSlides = hotStories.length;
        let slideInterval;
        const intervalTime = 6000; // 6 seconds per slide

        const updateSlides = () => {
            // Update slides visibility
            const allSlides = document.querySelectorAll('.slide');
            allSlides.forEach((slide, index) => {
                if(index === currentSlideIndex) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });

            // Update dots
            const allDots = dotsContainer.querySelectorAll('button');
            allDots.forEach((dot, index) => {
                if(index === currentSlideIndex) {
                    dot.className = 'w-8 h-3 rounded-full transition-all duration-300 focus:outline-none bg-white';
                } else {
                    dot.className = 'w-3 h-3 rounded-full transition-all duration-300 focus:outline-none bg-white/50 hover:bg-white/80';
                }
            });
        };

        const nextSlide = () => {
            currentSlideIndex = (currentSlideIndex + 1) % totalSlides;
            updateSlides();
            resetInterval();
        };

        const prevSlide = () => {
            currentSlideIndex = (currentSlideIndex - 1 + totalSlides) % totalSlides;
            updateSlides();
            resetInterval();
        };

        const goToSlide = (index) => {
            currentSlideIndex = index;
            updateSlides();
            resetInterval();
        };

        const startInterval = () => {
            slideInterval = setInterval(nextSlide, intervalTime);
        };

        const resetInterval = () => {
            clearInterval(slideInterval);
            startInterval();
        };

        // Event Listeners for controls
        document.getElementById('next-slide').addEventListener('click', (e) => {
            e.preventDefault(); // prevent triggering the link underneath
            nextSlide();
        });
        
        document.getElementById('prev-slide').addEventListener('click', (e) => {
            e.preventDefault();
            prevSlide();
        });

        // Start auto-sliding
        startInterval();

    </script>
</body>
</html>
